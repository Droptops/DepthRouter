name: Fast frontier

on:
  push:
    branches:
      - research/predictive-address-frontier

jobs:
  cascade:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[hf]"
      - name: Coarse-to-fine address
        env:
          TOKENIZERS_PARALLELISM: "false"
        run: >-
          python experiments/hf_cascaded_address.py
          --model Qwen/Qwen2.5-0.5B-Instruct
          --device cpu
          --dtype float32
          --max-length 32
          --layer 18
          --bits 1 2
          --candidate-fractions 0.15 0.20 0.25 0.30
          --final-fractions 0.05 0.075 0.10 0.125
          --json-out fast_cascade.json
      - uses: actions/upload-artifact@v4
        with:
          name: fast-cascade
          path: fast_cascade.json

  decode-state:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[hf]"
      - name: Decode-state trained hot residual
        env:
          TOKENIZERS_PARALLELISM: "false"
        run: >-
          python experiments/hf_decode_state_trained.py
          --model Qwen/Qwen2.5-0.5B-Instruct
          --device cpu
          --dtype float32
          --max-length 32
          --layer 18
          --train-decode-steps 8
          --test-decode-steps 8
          --teacher-fraction 0.15
          --address-rank 8
          --residual-rank 32
          --fractions 0.10 0.125 0.15 0.20
          --steps 400
          --json-out fast_decode_state.json
      - uses: actions/upload-artifact@v4
        with:
          name: fast-decode-state
          path: fast_decode_state.json

  piecewise:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[hf]"
      - name: Predictive-state local operators
        env:
          TOKENIZERS_PARALLELISM: "false"
        run: >-
          python experiments/hf_piecewise_hot_surrogate.py
          --model Qwen/Qwen2.5-0.5B-Instruct
          --device cpu
          --dtype float32
          --max-length 32
          --max-tokens 512
          --clusters 4 8 16
          --ranks 4 8 16
          --steps 250
          --json-out fast_piecewise.json
      - uses: actions/upload-artifact@v4
        with:
          name: fast-piecewise
          path: fast_piecewise.json
