          python experiments/hf_binary_address.py             --model Qwen/Qwen2.5-0.5B-Instruct             --device cpu             --dtype float32             --max-length 32             --layer 23             --fractions 0.05 0.10 0.15 0.20 0.25             --address-bits 1 2 3 4             --json-out predictive_address_layer23.json
          python experiments/hf_binary_address.py             --model Qwen/Qwen2.5-0.5B-Instruct             --device cpu             --dtype float32             --max-length 32             --layer 18             --fractions 0.05 0.10 0.15 0.20 0.25             --address-bits 1 2 3 4             --json-out predictive_address_layer18.json
      - uses: actions/upload-artifact@v4
