name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest
      - name: Belief-page-packing smoke benchmark
        if: matrix.python-version == '3.12'
        run: >-
          python experiments/belief_page_packing.py
          --seeds 5
          --train-samples 1000
          --test-samples 1000
          --summary-only
      - name: Anytime conformal cache smoke benchmark
        if: matrix.python-version == '3.12'
        run: >-
          python experiments/anytime_conformal_cache.py
          --train-steps 500
          --calibration-examples 1000
          --test-examples 1000
          --summary-only
      - name: Dense operator-page smoke benchmark
        if: matrix.python-version == '3.12'
        run: >-
          python experiments/dense_operator_pages.py
          --train-steps 350
          --router-steps 150
          --train-examples 750
          --calibration-examples 500
          --test-examples 500
          --model-batch-size 100
          --oracle-kl 0.001
          --summary-only
