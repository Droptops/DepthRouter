name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest
      - name: Belief-page-packing smoke benchmark
        if: matrix.python-version == '3.10'
        run: >-
          python experiments/belief_page_packing.py
          --seeds 5
          --train-samples 1000
          --test-samples 1000
          --summary-only
      - name: Anytime conformal cache smoke benchmark
        if: matrix.python-version == '3.10'
        run: >-
          python experiments/anytime_conformal_cache.py
          --train-steps 500
          --calibration-examples 1000
          --test-examples 1000
          --summary-only
      - name: Dense operator-page smoke benchmark
        if: matrix.python-version == '3.10'
        run: >-
          python experiments/dense_operator_pages.py
          --train-steps 350
          --router-steps 150
          --train-examples 750
          --calibration-examples 500
          --test-examples 500
          --model-batch-size 100
          --oracle-kl 0.001
          --summary-only


  real-model-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[hf]"
      - name: Compile a real pretrained SwiGLU block with SimHash
        env:
          TOKENIZERS_PARALLELISM: "false"
        run: >-
          python experiments/hf_swiglu_compile.py
          --model Qwen/Qwen2.5-0.5B-Instruct
          --device cpu
          --dtype float32
          --max-length 32
          --max-trace-tokens 512
          --units-per-page 128
          --mass-target 0.95
          --compiler simhash
          --simhash-bits 16
          --json-out real_model_gate_simhash.json
      - name: Compile the same block with balanced co-demand clustering
        env:
          TOKENIZERS_PARALLELISM: "false"
        run: >-
          python experiments/hf_swiglu_compile.py
          --model Qwen/Qwen2.5-0.5B-Instruct
          --device cpu
          --dtype float32
          --max-length 32
          --max-trace-tokens 512
          --units-per-page 128
          --mass-target 0.95
          --compiler balanced
          --json-out real_model_gate_balanced.json
      - uses: actions/upload-artifact@v4
        with:
          name: real-model-gate
          path: real_model_gate_*.json


  real-sparsity-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[hf]"
      - name: Scan neuron-level sparsity across all Qwen layers
        env:
          TOKENIZERS_PARALLELISM: "false"
        run: >-
          python experiments/hf_neuron_sparsity_scan.py
          --model Qwen/Qwen2.5-0.5B-Instruct
          --device cpu
          --dtype float32
          --max-length 32
          --max-trace-tokens 192
          --behavioral-layers 3
          --probe-fractions 0.10 0.25 0.50
          --json-out real_sparsity_scan.json
      - uses: actions/upload-artifact@v4
        with:
          name: real-sparsity-scan
          path: real_sparsity_scan.json
