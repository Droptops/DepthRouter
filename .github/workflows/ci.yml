name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest
      - name: Belief-page-packing smoke benchmark
        if: matrix.python-version == '3.10'
        run: >-
          python experiments/belief_page_packing.py
          --seeds 5
          --train-samples 1000
          --test-samples 1000
          --summary-only
      - name: Anytime conformal cache smoke benchmark
        if: matrix.python-version == '3.10'
        run: >-
          python experiments/anytime_conformal_cache.py
          --train-steps 500
          --calibration-examples 1000
          --test-examples 1000
          --summary-only
      - name: Dense operator-page smoke benchmark
        if: matrix.python-version == '3.10'
        run: >-
          python experiments/dense_operator_pages.py
          --train-steps 350
          --router-steps 150
          --train-examples 750
          --calibration-examples 500
          --test-examples 500
          --model-batch-size 100
          --oracle-kl 0.001
          --summary-only


  real-model-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[hf]"
      - name: Compile a real pretrained SwiGLU block with SimHash
        env:
          TOKENIZERS_PARALLELISM: "false"
        run: >-
          python experiments/hf_swiglu_compile.py
          --model Qwen/Qwen2.5-0.5B-Instruct
          --device cpu
          --dtype float32
          --max-length 32
          --max-trace-tokens 512
          --units-per-page 128
          --mass-target 0.95
          --compiler simhash
          --simhash-bits 16
          --json-out real_model_gate_simhash.json
      - name: Compile the same block with balanced co-demand clustering
        env:
          TOKENIZERS_PARALLELISM: "false"
        run: >-
          python experiments/hf_swiglu_compile.py
          --model Qwen/Qwen2.5-0.5B-Instruct
          --device cpu
          --dtype float32
          --max-length 32
          --max-trace-tokens 512
          --units-per-page 128
          --mass-target 0.95
          --compiler balanced
          --json-out real_model_gate_balanced.json
      - uses: actions/upload-artifact@v4
        with:
          name: real-model-gate
          path: real_model_gate_*.json


  real-sparsity-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[hf]"
      - name: Scan neuron-level sparsity across all Qwen layers
        env:
          TOKENIZERS_PARALLELISM: "false"
        run: >-
          python experiments/hf_neuron_sparsity_scan.py
          --model Qwen/Qwen2.5-0.5B-Instruct
          --device cpu
          --dtype float32
          --max-length 32
          --max-trace-tokens 192
          --behavioral-layers 3
          --probe-fractions 0.10 0.25 0.50
          --json-out real_sparsity_scan.json
      - uses: actions/upload-artifact@v4
        with:
          name: real-sparsity-scan
          path: real_sparsity_scan.json


  hot-surrogate-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[hf]"
      - name: Probe low-rank hot surrogates on held-out Qwen prompts
        env:
          TOKENIZERS_PARALLELISM: "false"
        run: >-
          python experiments/hf_hot_surrogate_scan.py
          --model Qwen/Qwen2.5-0.5B-Instruct
          --device cpu
          --dtype float32
          --max-length 32
          --max-train-tokens 192
          --max-test-tokens 192
          --ranks 8 16 32 64 128
          --json-out hot_surrogate_scan.json
      - uses: actions/upload-artifact@v4
        with:
          name: hot-surrogate-scan
          path: hot_surrogate_scan.json


  end-to-end-sparsity:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[hf]"
      - name: Test final-logit tolerance to sparse Qwen MLP contributions
        env:
          TOKENIZERS_PARALLELISM: "false"
        run: >-
          python experiments/hf_end_to_end_sparsity.py
          --model Qwen/Qwen2.5-0.5B-Instruct
          --device cpu
          --dtype float32
          --max-length 32
          --layers 0 6 12 18 23
          --fractions 0.10 0.25 0.50
          --json-out end_to_end_sparsity.json
      - uses: actions/upload-artifact@v4
        with:
          name: end-to-end-sparsity
          path: end_to_end_sparsity.json


  state-cache-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[hf]"
      - name: Test hidden-state semantic memoization on held-out Qwen prompts
        env:
          TOKENIZERS_PARALLELISM: "false"
        run: >-
          python experiments/hf_state_cache_scan.py
          --model Qwen/Qwen2.5-0.5B-Instruct
          --device cpu
          --dtype float32
          --max-length 32
          --max-train-tokens 192
          --max-test-tokens 192
          --layers 0 6 12 18 23
          --cache-entries 16 32 64 128
          --json-out state_cache_scan.json
      - uses: actions/upload-artifact@v4
        with:
          name: state-cache-scan
          path: state_cache_scan.json


  binary-address-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[hf]"
      - name: Test 1-bit neural page-table addressing on final Qwen layer
        env:
          TOKENIZERS_PARALLELISM: "false"
        run: >-
          python experiments/hf_binary_address.py
          --model Qwen/Qwen2.5-0.5B-Instruct
          --device cpu
          --dtype float32
          --max-length 32
          --layer 23
          --fractions 0.10 0.25 0.50
          --json-out binary_address_scan.json
      - uses: actions/upload-artifact@v4
        with:
          name: binary-address-scan
          path: binary_address_scan.json


  temporal-locality-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[hf]"
      - name: Measure temporal working-set locality across Qwen tokens
        env:
          TOKENIZERS_PARALLELISM: "false"
        run: >-
          python experiments/hf_temporal_locality.py
          --model Qwen/Qwen2.5-0.5B-Instruct
          --device cpu
          --dtype float32
          --max-length 48
          --layers 0 12 23
          --fractions 0.10 0.25 0.50
          --units-per-page 32
          --cache-fractions 0.25 0.50 0.75
          --json-out temporal_locality.json
      - uses: actions/upload-artifact@v4
        with:
          name: temporal-locality-scan
          path: temporal_locality.json


  semantic-batching-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[hf]"
      - name: Test semantic batching of Qwen sparse working sets
        env:
          TOKENIZERS_PARALLELISM: "false"
        run: >-
          python experiments/hf_semantic_batching.py
          --model Qwen/Qwen2.5-0.5B-Instruct
          --device cpu
          --dtype float32
          --max-length 48
          --layer 23
          --fraction 0.25
          --units-per-page 16
          --scheduler-batch-size 16
          --json-out semantic_batching.json
      - uses: actions/upload-artifact@v4
        with:
          name: semantic-batching-scan
          path: semantic_batching.json


  vertical-sparsity-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[hf]"
      - name: Probe per-token vertical MLP sparsity on Qwen
        env:
          TOKENIZERS_PARALLELISM: "false"
        run: >-
          python experiments/hf_vertical_sparsity.py
          --model Qwen/Qwen2.5-0.5B-Instruct
          --device cpu
          --dtype float32
          --max-length 32
          --retain-fractions 0.25 0.50 0.75
          --json-out vertical_sparsity.json
      - uses: actions/upload-artifact@v4
        with:
          name: vertical-sparsity-scan
          path: vertical_sparsity.json
